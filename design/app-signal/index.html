<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MouthKeys App Signal</title>
<style>
/* =====================================================================================
   MOUTHKEYS · APP · SIGNAL
   The main window as an engineering drawing of an instrument. The overlay's tokens, verbatim
   (design/visual-language/DESIGN.md §2), plus a small set of window-only tokens below them.
   Zero gradients, zero blur (one float shadow under windows, as the overlay), zero radius.
   ===================================================================================== */
:root {
  --font: -apple-system, "SF Pro Text", "SF Pro Display", system-ui, "Helvetica Neue", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;

  /* ---- overlay tokens, DESIGN.md §2, dark ---- */
  --accent: #FF4F1F;
  --on-accent: #111214;
  --surface: #111214;
  --edge: #2C2E33;
  --chip: #1A1B1F;
  --drop: 0 2px 0 rgba(0, 0, 0, .35);
  --float: 0 9px 36px rgba(0, 0, 0, .55);
  --ink: #FFFFFF;
  --midline: #2C2E33;
  --text: rgba(255, 255, 255, .92);
  --text-2: rgba(255, 255, 255, .58);
  --text-dim: rgba(255, 255, 255, .46);
  --inv-bg: #FFFFFF;
  --inv-fg: #111214;
  --inv-fg-2: rgba(17, 18, 20, .62);
  --bracket: rgba(255, 255, 255, .78);
  --halo: var(--surface);
  --grat: rgba(255, 255, 255, .20);

  /* ---- window-only tokens (new in this round) ---- */
  --desk: #0A0B0C;              /* the stage behind the window, not part of the product */
  --rule: #2C2E33;              /* table and section rules: = edge */
  --rule-soft: #1F2024;         /* hairlines inside a table (row separators) */
  --sidebar: #0C0D0F;           /* one step below surface: the sidebar is the drawing's margin */
  --field: #0C0D0F;             /* text field and hotkey well */
  --glyph-off: rgba(255, 255, 255, .28);

  /* ---- bracket grammar, DIRECTION.md "Tokens" ---- */
  --tk-len: 6px;
  --tk-w: 1.5px;
  --tk-gap: 2px;
}
:root[data-theme="light"] {
  --surface: #FFFFFF;
  --edge: #111214;
  --chip: #F2F2F4;
  --drop: 0 2px 0 #111214;
  --float: 0 5px 24px rgba(0, 0, 0, .16);
  --ink: #111214;
  --midline: #D3D4D8;
  --text: #111214;
  --text-2: #111214;
  --text-dim: rgba(17, 18, 20, .50);
  --inv-bg: #111214;
  --inv-fg: #FFFFFF;
  --inv-fg-2: rgba(255, 255, 255, .66);
  --bracket: #111214;
  --grat: rgba(17, 18, 20, .30);

  --desk: #D9DADD;
  --rule: #111214;
  --rule-soft: #D3D4D8;
  --sidebar: #F7F7F8;
  --field: #FFFFFF;
  --glyph-off: rgba(17, 18, 20, .28);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--desk); color: var(--text);
  font: 400 13px/18px var(--font);
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
  overflow: hidden; cursor: default; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; border-radius: 0; cursor: default; outline: none; }
input { font: inherit; color: inherit; border-radius: 0; outline: none; }
.mono, .placard { font-family: var(--mono); }
.placard { font: 500 10px/14px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.placard b { font-weight: 600; color: var(--text); }

/* =====================================================================================
   THE BRACKET PRIMITIVE (.tk), copied from the overlay: four L marks outside the corners,
   a 1 px halo in the surface colour under a 1.5 px stroke. No layout, no hit-testing.
   Three uses in the window (DIRECTION.md "Bracket rule"):
     .tk-rest   drawn at rest: the screen's primary action, the chosen item of a choice set
     default    drawn on hover: every other clickable control (buttons, segments, fields, keys)
     rows       never bracketed: they invert (sidebar, history, dictionary, menus)
   ===================================================================================== */
.tk {
  --tk-o: calc(var(--tk-gap) + var(--tk-w) + var(--tk-hx, 0px));
  position: absolute; inset: calc(-1 * var(--tk-o)); bottom: calc(-1 * (var(--tk-o) + var(--tk-drop, 0px)));
  pointer-events: none; z-index: 2; opacity: 0; transition: opacity 60ms linear; color: var(--bracket);
}
.tk.tk-halo { --tk-hx: 1px; --tk-l: calc(var(--tk-len) + 2px); --tk-s: calc(var(--tk-w) + 2px); color: var(--halo); z-index: 1; }
.tk i { position: absolute; width: var(--tk-l, var(--tk-len)); height: var(--tk-l, var(--tk-len)); border: 0 solid currentColor; }
.tk i:nth-child(1) { top: 0; left: 0; border-top-width: var(--tk-s, var(--tk-w)); border-left-width: var(--tk-s, var(--tk-w)); }
.tk i:nth-child(2) { top: 0; right: 0; border-top-width: var(--tk-s, var(--tk-w)); border-right-width: var(--tk-s, var(--tk-w)); }
.tk i:nth-child(3) { bottom: 0; left: 0; border-bottom-width: var(--tk-s, var(--tk-w)); border-left-width: var(--tk-s, var(--tk-w)); }
.tk i:nth-child(4) { bottom: 0; right: 0; border-bottom-width: var(--tk-s, var(--tk-w)); border-right-width: var(--tk-s, var(--tk-w)); }
.bk { position: relative; }
.bk:hover:not(:disabled):not(.off) > .tk, .bk.tk-rest > .tk, .bk.is-hover > .tk { opacity: 1; }
.bk.lg { --tk-len: 10px; --tk-gap: 3px; }     /* cards and large targets: the pill's 10 pt arm, 3 pt gap */

/* =====================================================================================
   STAGE: a flat desk, a menu bar strip, the window. Not the product.
   ===================================================================================== */
.menubar {
  position: fixed; top: 0; left: 0; right: 0; height: 26px; z-index: 50;
  display: flex; align-items: center; justify-content: space-between; padding: 0 14px;
  background: var(--surface); box-shadow: inset 0 -1px 0 var(--edge);
  font: 500 13px/1 var(--font); color: var(--text);
}
.menubar .l, .menubar .r { display: flex; align-items: center; gap: 18px; }
.menubar .app { font-weight: 700; }
.menubar .clock { font: 500 12px/1 var(--mono); letter-spacing: .04em; color: var(--text-2); }
.mb-mark { position: relative; width: 30px; height: 22px; display: grid; place-items: center; color: var(--text); }
.mb-mark .mb-bracket { opacity: 0; transition: opacity 60ms linear; }
.mb-mark:hover .mb-bracket, .mb-mark.open .mb-bracket { opacity: 1; }

.proto {
  display: flex; gap: 0; align-items: stretch; height: 26px; margin-right: 6px;
  box-shadow: inset 1px 0 0 var(--edge), inset -1px 0 0 var(--edge);
}
.proto > * { height: 26px; padding: 0 12px; display: flex; align-items: center; font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.proto > * + * { box-shadow: inset 1px 0 0 var(--edge); }
.proto button:hover { background: var(--inv-bg); color: var(--inv-fg); }
.proto .tag { color: var(--text); font-weight: 600; }

.stage { position: fixed; inset: 26px 0 0 0; display: grid; place-items: center; }

/* =====================================================================================
   WINDOW: square, 1 px edge, the flat 2 pt drop rule over the soft float shadow.
   ===================================================================================== */
.win {
  --win-w: 1120px; --win-h: 760px;
  position: relative; width: var(--win-w); height: var(--win-h);
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--edge), var(--drop), var(--float);
  display: grid; grid-template-rows: 40px 1fr; overflow: hidden;
}
.titlebar {
  position: relative; display: grid; grid-template-columns: 240px 1fr auto; align-items: center;
  box-shadow: inset 0 -1px 0 var(--edge);
}
.lights { display: flex; gap: 8px; padding-left: 16px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: var(--edge); box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
.win.focused .lights i:nth-child(1) { background: #FF5F57; } .win.focused .lights i:nth-child(2) { background: #FEBC2E; } .win.focused .lights i:nth-child(3) { background: #28C840; }
.titlebar .crumb { height: 40px; display: flex; align-items: center; gap: 0; box-shadow: inset 1px 0 0 var(--edge); padding-left: 20px; }
.titlebar .crumb span { font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.titlebar .crumb span b { color: var(--text); font-weight: 600; }
.titlebar .crumb .sep { margin: 0 10px; color: var(--grat); }
.titlebar .status { display: flex; height: 40px; }
.titlebar .status > span { display: flex; align-items: center; gap: 8px; padding: 0 16px; box-shadow: inset 1px 0 0 var(--edge); font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.titlebar .status > span b { color: var(--text); font-weight: 600; }
.sq { display: inline-block; width: 6px; height: 6px; background: var(--accent); flex: none; }
.sq.hollow { background: none; box-shadow: inset 0 0 0 1.5px var(--accent); }
.sq.ink { background: var(--text); }
.sq.off { background: none; box-shadow: inset 0 0 0 1px var(--text-2); }

.body { display: grid; grid-template-columns: 240px 1fr; min-height: 0; }

/* ---------- sidebar: the drawing's margin. Rows invert on selection and hover. ---------- */
.side { background: var(--sidebar); box-shadow: inset -1px 0 0 var(--edge); display: flex; flex-direction: column; min-height: 0; }
.side-scroll { flex: 1; overflow-y: auto; padding: 14px 0 10px; scrollbar-width: none; }
.side-scroll::-webkit-scrollbar { display: none; }
.side h6 { margin: 0; height: 30px; padding: 0 20px; display: flex; align-items: flex-end; padding-bottom: 7px; font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.side h6:not(:first-child) { margin-top: 10px; }
.nav {
  --c1: var(--text); --c2: var(--text-2);
  width: 100%; height: 34px; padding: 0 16px 0 20px; display: grid; grid-template-columns: 26px 22px 1fr auto; align-items: center; text-align: left;
  color: var(--c1);
}
.nav .ix { font: 500 10px/1 var(--mono); letter-spacing: .04em; color: var(--c2); }
.nav svg { width: 15px; height: 15px; color: var(--c2); }
.nav .t { font: 500 13px/1 var(--font); white-space: nowrap; }
.nav .n { font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--c2); min-width: 4ch; text-align: right; display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
.nav:hover { background: var(--chip); }
.nav.on { background: var(--inv-bg); --c1: var(--inv-fg); --c2: var(--inv-fg-2); }
.nav.on .sq.off { box-shadow: inset 0 0 0 1px var(--inv-fg-2); }
.side-foot { flex: none; box-shadow: inset 0 1px 0 var(--edge), inset -1px 0 0 var(--edge); padding: 12px 20px 14px; display: grid; gap: 6px; }
.side-foot .sfr { display: flex; justify-content: space-between; font: 500 10px/14px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.side-foot .sfr b { color: var(--text); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }

/* ---------- content pane ---------- */
.pane { position: relative; overflow-y: auto; min-height: 0; scrollbar-width: thin; }
.screen { display: none; padding: 30px 40px 48px; max-width: 880px; }
.screen.on { display: block; }
.screen.wide { max-width: none; }

/* title block: placard (index / section) over the headline, ruled underneath */
.head { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 24px; padding-bottom: 18px; margin-bottom: 26px; box-shadow: inset 0 -1px 0 var(--rule); }
.head .placard { margin-bottom: 8px; }
.head h1 { margin: 0; font: 600 28px/32px var(--font); letter-spacing: -.01em; color: var(--text); }
.head p { margin: 8px 0 0; font: 400 14px/20px var(--font); color: var(--text-2); max-width: 560px; }
.head .act { display: flex; gap: 14px; align-items: center; }

/* section: a mono placard and a rule that runs to the right edge, like a drawing's zone label */
.sec { margin: 34px 0 0; }
.sec:first-of-type { margin-top: 0; }
.sec > h2 { margin: 0 0 4px; height: 20px; display: flex; align-items: center; gap: 12px; font: 600 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text); }
.sec > h2::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.sec > h2 .r { order: 2; font-weight: 500; color: var(--text-2); }
.sec > .note { margin: 6px 0 10px; font: 400 13px/18px var(--font); color: var(--text-2); }

/* settings table: label + help left, control right, hairline between rows */
.rows { display: flex; flex-direction: column; }
.row {
  display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center;
  min-height: 60px; padding: 12px 0; box-shadow: inset 0 -1px 0 var(--rule-soft);
}
.row:last-child { box-shadow: none; }
.row .lbl { font: 500 14px/19px var(--font); color: var(--text); }
.row .help { margin-top: 3px; font: 400 13px/18px var(--font); color: var(--text-2); max-width: 470px; }
.row .ctl { display: flex; align-items: center; gap: 12px; justify-content: flex-end; }
.row.sub { padding-left: 22px; position: relative; }
.row.sub::before { content: ""; position: absolute; left: 6px; top: 0; bottom: 50%; width: 9px; border-left: 1px solid var(--grat); border-bottom: 1px solid var(--grat); }
.row.dim .lbl, .row.dim .help { color: var(--text-dim); }

/* =====================================================================================
   CONTROLS
   ===================================================================================== */
/* Primary action: an ink slab (inv-bg), brackets at rest. Press: surface + 1 px edge.
   .live: orange, for the one thing on the page that is live right now (record, capture). */
.btn {
  position: relative; height: 36px; min-width: 112px; padding: 0 18px; display: inline-grid; place-items: center;
  font: 600 13px/1 var(--font); white-space: nowrap;
  background: var(--inv-bg); color: var(--inv-fg);
  transition: background-color 60ms linear, color 60ms linear;
}
.btn > span { grid-area: 1/1; display: inline-flex; align-items: center; gap: 8px; }
.btn svg { width: 14px; height: 14px; }
.btn .k { font: 500 10px/1 var(--mono); letter-spacing: .06em; opacity: .7; }
.btn:active, .btn.is-pressed { background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1px var(--edge); }
.btn.live { background: var(--accent); color: var(--on-accent); }
.btn.live:active { background: var(--surface); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.btn.lg { height: 44px; min-width: 160px; font-size: 14px; padding: 0 22px; }
.btn:disabled { background: var(--chip); color: var(--glyph-off); }
/* Secondary: outlined, bracket on hover, invert on press */
.btn2 {
  position: relative; height: 32px; min-width: 88px; padding: 0 14px; display: inline-grid; place-items: center;
  font: 500 13px/1 var(--font); white-space: nowrap; color: var(--text);
  box-shadow: inset 0 0 0 1px var(--edge);
}
:root:not([data-theme="light"]) .btn2 { box-shadow: inset 0 0 0 1px #45484F; }
.btn2 > span { grid-area: 1/1; display: inline-flex; align-items: center; gap: 7px; }
.btn2 svg { width: 13px; height: 13px; }
.btn2:active, .btn2.is-pressed { background: var(--inv-bg); color: var(--inv-fg); }
.btn2.sm { height: 28px; min-width: 0; padding: 0 10px; font-size: 13px; }
/* Text action: bare, bracket on hover (overlay notice-row grammar) */
.tbtn { position: relative; height: 22px; padding: 0 4px; margin: 0 -4px; display: inline-flex; align-items: center; gap: 6px; font: 500 13px/1 var(--font); color: var(--text-2); }
.tbtn.accent { color: var(--accent); font-weight: 600; }
.tbtn svg { width: 12px; height: 12px; }
.tbtn:active { background: var(--inv-bg); color: var(--inv-fg); }

/* Toggle: a square switch, 40 x 20, with its ON / OFF word in a reserved 3 ch box. On = inverted. */
.tog { position: relative; display: inline-flex; align-items: center; gap: 10px; }
.tog .sw { position: relative; width: 40px; height: 20px; box-shadow: inset 0 0 0 1px var(--edge); background: var(--field); transition: background-color 60ms linear; }
:root:not([data-theme="light"]) .tog .sw { box-shadow: inset 0 0 0 1px #45484F; }
.tog .sw::after { content: ""; position: absolute; top: 4px; left: 4px; width: 12px; height: 12px; background: var(--text-2); transition: transform 60ms linear, background-color 60ms linear; }
.tog .w { width: 3ch; font: 600 10px/1 var(--mono); letter-spacing: .06em; color: var(--text-2); text-align: left; }
.tog[aria-checked="true"] .sw { background: var(--inv-bg); box-shadow: none; }
.tog[aria-checked="true"] .sw::after { transform: translateX(20px); background: var(--surface); }
.tog[aria-checked="true"] .w { color: var(--text); }
.tog .tk { inset: auto; left: calc(-1 * var(--tk-o)); top: calc(-1 * var(--tk-o)); width: calc(40px + 2 * var(--tk-o)); height: calc(20px + 2 * var(--tk-o)); }
.tog.off { opacity: .45; }

/* Segmented: fixed-width cells, 1 px rules, the chosen cell inverted. Bracket on hover around the whole control. */
.seg { position: relative; display: inline-flex; box-shadow: inset 0 0 0 1px var(--edge); }
:root:not([data-theme="light"]) .seg { box-shadow: inset 0 0 0 1px #45484F; }
.seg button { height: 30px; min-width: 76px; padding: 0 12px; font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); position: relative; }
.seg button + button { box-shadow: inset 1px 0 0 var(--edge); }
:root:not([data-theme="light"]) .seg button + button { box-shadow: inset 1px 0 0 #45484F; }
.seg button:hover { color: var(--text); background: var(--chip); }
.seg button[aria-pressed="true"] { background: var(--inv-bg); color: var(--inv-fg); font-weight: 600; }
.seg.pro button { font: 500 13px/1 var(--font); letter-spacing: 0; text-transform: none; }

/* Picker: a field with a value and a chevron; opens a square menu like the overlay's */
.pick { position: relative; height: 32px; min-width: 240px; padding: 0 34px 0 12px; display: inline-flex; align-items: center; font: 500 13px/1 var(--font); color: var(--text); box-shadow: inset 0 0 0 1px var(--edge); background: var(--field); text-align: left; }
:root:not([data-theme="light"]) .pick { box-shadow: inset 0 0 0 1px #45484F; }
.pick .v { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick .m { margin-left: 8px; font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.pick::after { content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; border-right: 1.5px solid var(--text-2); border-bottom: 1.5px solid var(--text-2); transform: translateY(-70%) rotate(45deg); }
.pick.w-sm { min-width: 160px; }
.menu {
  position: fixed; z-index: 200; min-width: 240px; padding: 5px; display: none;
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--edge), var(--drop);
  font: 400 13px/1 var(--font); color: var(--text);
}
:root:not([data-theme="light"]) .menu { background: var(--chip); }
.menu.open { display: block; }
.menu .mh { height: 24px; padding: 0 9px; display: flex; align-items: center; justify-content: space-between; font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.menu .mh b { font-weight: 600; color: var(--text); display: inline-flex; gap: 6px; align-items: center; }
.menu .mi { height: 24px; padding: 0 9px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.menu .mi > span { flex: 1; }
.menu .mi .ck { width: 12px; flex: none; font: 600 12px/1 var(--mono); }
.menu .mi kbd, .menu .mi em { font: 400 13px/1 var(--font); font-style: normal; color: var(--text-2); }
.menu .mi em.m { font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.menu .mi svg { color: var(--text-2); flex: none; }
.menu .mi:hover { background: var(--inv-bg); color: var(--inv-fg); }
.menu .mi:hover kbd, .menu .mi:hover em, .menu .mi:hover svg { color: var(--inv-fg-2); }
.menu .sep { height: 1px; margin: 5px 9px; background: var(--rule); }
:root[data-theme="light"] .menu .sep { background: rgba(17, 18, 20, .16); }
.menu .mi.dis { color: var(--text-dim); }
.menu .mi.dis:hover { background: none; color: var(--text-dim); }

/* Slider: a 1 px rule with the overlay's age-ruler graticule under it, a square thumb, a fixed mono readout */
.sld { position: relative; display: inline-flex; align-items: center; gap: 14px; }
.sld .trk { position: relative; width: 220px; height: 28px; }
.sld .trk .line { position: absolute; left: 0; right: 0; top: 10px; height: 1px; background: var(--edge); }
:root:not([data-theme="light"]) .sld .trk .line { background: #45484F; }
.sld .trk .fill { position: absolute; left: 0; top: 9px; height: 3px; background: var(--ink); }
.sld .trk .ticks { position: absolute; left: 0; right: 0; top: 17px; height: 6px; }
.sld .trk .ticks i { position: absolute; top: 0; width: 1px; height: 3px; background: var(--grat); }
.sld .trk .ticks i.maj { height: 6px; }
.sld .trk .th { position: absolute; top: 3px; width: 10px; height: 16px; margin-left: -5px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--ink); }
.sld .val { width: 5ch; text-align: right; font: 600 13px/1 var(--mono); color: var(--text); }

/* Hotkey: one key cap per key, mono; capture state shows the live orange square and PRESS KEYS */
.hk { position: relative; min-width: 168px; height: 34px; padding: 0 10px 0 6px; display: inline-flex; align-items: center; gap: 4px; background: var(--field); box-shadow: inset 0 0 0 1px var(--edge); }
:root:not([data-theme="light"]) .hk { box-shadow: inset 0 0 0 1px #45484F; }
.cap { height: 22px; min-width: 22px; padding: 0 6px; display: inline-grid; place-items: center; font: 600 11px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--text); background: var(--chip); box-shadow: inset 0 0 0 1px var(--edge), 0 1px 0 var(--edge); }
:root[data-theme="light"] .cap { box-shadow: inset 0 0 0 1px #111214, 0 1px 0 #111214; background: #fff; }
.hk .rec { display: none; align-items: center; gap: 8px; font: 600 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); padding-left: 6px; }
.hk .x { margin-left: auto; font: 500 10px/1 var(--mono); letter-spacing: .06em; color: var(--text-2); text-transform: uppercase; padding-left: 10px; }
.hk.capturing { box-shadow: inset 0 0 0 1.5px var(--accent); }
.hk.capturing .cap { display: none; }
.hk .cap { box-shadow: inset 0 0 0 1px var(--edge), 0 1px 0 var(--edge); }
.hk.capturing .rec { display: inline-flex; }

/* Text field and search */
.field { position: relative; height: 34px; display: inline-flex; align-items: center; background: var(--field); box-shadow: inset 0 0 0 1px var(--edge); padding: 0 12px; gap: 8px; }
:root:not([data-theme="light"]) .field { box-shadow: inset 0 0 0 1px #45484F; }
.field input { border: 0; background: none; height: 100%; flex: 1; min-width: 0; font: 400 14px/1 var(--font); color: var(--text); }
.field input::placeholder { color: var(--text-dim); }
.field:focus-within { box-shadow: inset 0 0 0 1.5px var(--ink); }
.field svg { width: 14px; height: 14px; color: var(--text-2); flex: none; }
.field kbd { font: 500 10px/1 var(--mono); letter-spacing: .06em; color: var(--text-2); }
.area { width: 100%; min-height: 120px; padding: 12px 14px; border: 0; background: var(--field); box-shadow: inset 0 0 0 1px var(--edge); font: 400 14px/20px var(--font); color: var(--text); resize: none; outline: none; }
:root:not([data-theme="light"]) .area { box-shadow: inset 0 0 0 1px #45484F; }
.area:focus { box-shadow: inset 0 0 0 1.5px var(--ink); }

/* Status word: mono, with a square. Orange square = live/actionable, ink square = done, outline = absent */
.stat { display: inline-flex; align-items: center; gap: 8px; font: 600 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text); white-space: nowrap; }
.stat.dim { color: var(--text-2); font-weight: 500; }

/* Box: a ruled panel (a drawing's detail view). No fill change, 1 px edge. */
.box { position: relative; box-shadow: inset 0 0 0 1px var(--rule); }
.box > header { height: 36px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; box-shadow: inset 0 -1px 0 var(--rule); font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.box > header b { color: var(--text); font-weight: 600; }
.box > footer { height: 28px; display: flex; box-shadow: inset 0 1px 0 var(--rule); font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.box > footer > span { padding: 0 16px; display: flex; align-items: center; }
.box > footer > span + span { box-shadow: inset 1px 0 0 var(--rule); }
.box > footer > span.grow { flex: 1; }
.box > footer > span b { color: var(--text); font-weight: 600; }

/* =====================================================================================
   LISTS AND TABLES: the overlay's history card, at window scale. Rows invert on hover,
   the selected row stays inverted. Index column in mono, prose in Pro.
   ===================================================================================== */
.tbl { box-shadow: inset 0 0 0 1px var(--rule); }
.tbl .th { height: 32px; display: grid; align-items: center; padding: 0 16px; box-shadow: inset 0 -1px 0 var(--rule); font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.tbl .tr { --c1: var(--text); --c2: var(--text-2); display: grid; align-items: center; padding: 0 16px; min-height: 44px; box-shadow: inset 0 -1px 0 var(--rule-soft); color: var(--c1); }
.tbl .tr:last-child { box-shadow: none; }
.tbl .tr:hover, .tbl .tr.on { background: var(--inv-bg); --c1: var(--inv-fg); --c2: var(--inv-fg-2); }
.tbl .tr .m { font: 500 10px/14px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--c2); }
.tbl .tr .mono { font: 500 13px/1 var(--mono); }
.tbl .day { height: 28px; display: flex; align-items: center; padding: 0 16px; font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); box-shadow: inset 0 -1px 0 var(--rule); background: var(--sidebar); }

/* History: list (left) + detail (right) */
.hist { display: grid; grid-template-columns: 380px 1fr; height: 100%; min-height: 0; }
.hist-list { display: flex; flex-direction: column; min-height: 0; box-shadow: inset -1px 0 0 var(--rule); }
.hist-tools { flex: none; padding: 16px 16px 12px; display: grid; gap: 10px; box-shadow: inset 0 -1px 0 var(--rule), inset -1px 0 0 var(--rule); }
.hist-scroll { flex: 1; overflow-y: auto; min-height: 0; scrollbar-width: none; }
.hist-scroll::-webkit-scrollbar { display: none; }
.hrow { --c1: var(--text); --c2: var(--text-2); display: grid; grid-template-columns: 52px 1fr; padding: 12px 16px 13px; box-shadow: inset 0 -1px 0 var(--rule-soft), inset -1px 0 0 var(--rule); color: var(--c1); }
.hrow:hover { background: var(--chip); }
.hrow.on { background: var(--inv-bg); --c1: var(--inv-fg); --c2: var(--inv-fg-2); box-shadow: none; }
.hrow .ix { display: flex; flex-direction: column; gap: 3px; font: 600 11.5px/17px var(--mono); color: var(--c2); }
.hrow .ix span { font: 500 10px/14px var(--mono); letter-spacing: .04em; }
.hrow p { margin: 0; font: 400 13px/18px var(--font); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.hrow .meta { margin-top: 6px; display: flex; align-items: center; gap: 0; font: 500 10px/14px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--c2); }
.flag { display: inline-flex; align-items: center; gap: 6px; margin-left: 12px; font-weight: 600; color: var(--c1); }
.flag i { width: 6px; height: 6px; background: var(--accent); }
.hist-detail { display: flex; flex-direction: column; min-height: 0; }
.hist-detail .dh { flex: none; display: grid; grid-template-columns: repeat(5, auto) 1fr; box-shadow: inset 0 -1px 0 var(--rule); }
.hist-detail .dh > div { padding: 12px 18px; box-shadow: inset -1px 0 0 var(--rule); }
.hist-detail .dh > div:last-child { box-shadow: none; }
.hist-detail .dh .placard { display: block; margin-bottom: 4px; }
.hist-detail .dh .v { font: 600 14px/18px var(--mono); color: var(--text); white-space: nowrap; }
.hist-detail .txt { flex: 1; overflow-y: auto; padding: 26px 30px; font: 400 16px/25px var(--font); color: var(--text); user-select: text; -webkit-user-select: text; }
.hist-detail .txt h3 { margin: 0 0 10px; }
.hist-detail .raw { margin: 22px 0 0; padding-top: 16px; box-shadow: inset 0 1px 0 var(--rule-soft); font: 400 14px/21px var(--font); color: var(--text-2); }
.hist-detail .acts { flex: none; height: 64px; padding: 0 30px; display: flex; align-items: center; gap: 18px; box-shadow: inset 0 1px 0 var(--rule); }
.hist-detail .acts .sp { flex: 1; }

/* Empty state: a drawing with nothing on it yet. A dashed frame, a mono caption, one action. */
.empty { position: relative; display: grid; place-items: center; text-align: center; padding: 56px 24px; box-shadow: inset 0 0 0 1px var(--rule); background-image: repeating-linear-gradient(0deg, transparent 0 23px, var(--rule-soft) 23px 24px), repeating-linear-gradient(90deg, transparent 0 23px, var(--rule-soft) 23px 24px); }
.empty .card { background: var(--surface); padding: 22px 28px; box-shadow: inset 0 0 0 1px var(--rule); max-width: 420px; }
.empty .placard { display: block; margin-bottom: 10px; }
.empty h3 { margin: 0; font: 600 17px/22px var(--font); }
.empty p { margin: 8px 0 16px; font: 400 13px/19px var(--font); color: var(--text-2); }

/* Choice cards (engines, languages, wizard options): 1 px edge. The chosen card carries brackets at rest
   and an inverted index tab; others bracket on hover. */
.cards { display: grid; gap: 14px; }
.ccard { --c2: var(--text-2); position: relative; padding: 16px 18px; box-shadow: inset 0 0 0 1px var(--rule); text-align: left; background: var(--surface); display: grid; gap: 6px; align-content: start; }
:root:not([data-theme="light"]) .ccard { box-shadow: inset 0 0 0 1px #3A3D44; }
.ccard:hover { background: var(--chip); }
.ccard .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ccard .name { font: 600 15px/20px var(--font); color: var(--text); }
.ccard .desc { font: 400 13px/18px var(--font); color: var(--c2); }
.ccard .specs { display: flex; flex-wrap: wrap; gap: 0; margin-top: 6px; }
.ccard .specs span { font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--c2); padding: 6px 10px 6px 0; margin-right: 10px; box-shadow: none; }
.ccard .specs span b { color: var(--text); font-weight: 600; margin-left: 4px; }
.ccard.on { box-shadow: inset 0 0 0 1.5px var(--ink); }
.ccard .ix { font: 600 10px/1 var(--mono); letter-spacing: .06em; color: var(--c2); }
.ccard.on .ix { background: var(--inv-bg); color: var(--inv-fg); padding: 4px 6px; margin: -4px -6px; }

/* Meter: a filled bar on the pitch grid (for speed / accuracy ratings and downloads). 10 cells. */
.meter { display: inline-flex; gap: 2px; vertical-align: middle; }
.meter i { width: 6px; height: 10px; box-shadow: inset 0 0 0 1px var(--grat); }
.meter i.f { background: var(--ink); box-shadow: none; }
.prog { position: relative; height: 4px; width: 100%; background: var(--rule-soft); }
.prog > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* KPI tiles (Stats): mono numerals large, the placard above, a ruled grid with no gaps */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); box-shadow: inset 0 0 0 1px var(--rule); }
.kpi { padding: 16px 18px 18px; box-shadow: inset -1px 0 0 var(--rule); }
.kpi:last-child { box-shadow: none; }
.kpi .placard { display: block; margin-bottom: 12px; }
.kpi .v { font: 600 34px/36px var(--mono); letter-spacing: -.02em; color: var(--text); }
.kpi .v small { font: 500 12px/1 var(--mono); letter-spacing: .06em; color: var(--text-2); margin-left: 6px; text-transform: uppercase; }
.kpi .d { margin-top: 8px; font: 500 10px/14px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }

/* Bar chart: square-ended ink bars on the overlay's 4 pt pitch rhythm, a midline-style baseline, today in accent */
.chart { position: relative; padding: 18px 18px 12px; }
.chart .bars { position: relative; height: 150px; display: flex; align-items: flex-end; gap: 6px; box-shadow: inset 0 -1px 0 var(--edge); }
.chart .bars i { flex: 1; background: var(--ink); min-height: 2px; position: relative; }
.chart .bars i.today { background: var(--accent); }
.chart .bars i:hover::after { content: attr(data-v); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); font: 600 10px/1 var(--mono); color: var(--text); white-space: nowrap; background: var(--surface); padding: 3px 4px; box-shadow: inset 0 0 0 1px var(--edge); }
.chart .grid { position: absolute; left: 18px; right: 18px; top: 18px; height: 150px; pointer-events: none; }
.chart .grid i { position: absolute; left: 0; right: 0; height: 1px; background: var(--rule-soft); }
.chart .grid i span { position: absolute; right: 0; top: -14px; font: 500 10px/1 var(--mono); color: var(--text-2); }
.chart .xl { display: flex; gap: 6px; margin-top: 6px; }
.chart .xl span { flex: 1; text-align: center; font: 500 10px/1 var(--mono); letter-spacing: .04em; color: var(--text-2); }
.chart .xl span:not(.k) { visibility: hidden; }

/* Callout: a ruled note with a left index (Advanced / unsupported notice) */
.callout { display: grid; grid-template-columns: 4px 1fr; box-shadow: inset 0 0 0 1px var(--rule); }
.callout > i { background: var(--ink); }
.callout.warn > i { background: var(--accent); }
.callout > div { padding: 14px 18px; }
.callout .placard { display: block; margin-bottom: 6px; }
.callout p { margin: 0; font: 400 13px/19px var(--font); color: var(--text); }
.callout p + p { margin-top: 6px; color: var(--text-2); }

/* Steps (Getting Started quick setup): numbered rows, a mono step number in a square, status at right */
.steps { box-shadow: inset 0 0 0 1px var(--rule); }
.step { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; min-height: 76px; box-shadow: inset 0 -1px 0 var(--rule); }
.step:last-child { box-shadow: none; }
.step .n { align-self: stretch; display: grid; place-items: center; box-shadow: inset -1px 0 0 var(--rule); font: 600 18px/1 var(--mono); color: var(--text-2); }
.step.done .n { color: var(--text); }
.step.next .n { background: var(--inv-bg); color: var(--inv-fg); }
.step .b { padding: 14px 20px; }
.step .b .lbl { font: 600 15px/20px var(--font); }
.step .b .help { font: 400 13px/18px var(--font); color: var(--text-2); margin-top: 2px; }
.step .r { padding-right: 20px; display: flex; align-items: center; gap: 18px; }
.step .r .stat { width: 112px; justify-content: flex-end; }

/* Key/value strip: a title-block row of cells */
.kv { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; box-shadow: inset 0 0 0 1px var(--rule); }
.kv > div { padding: 12px 16px; box-shadow: inset -1px 0 0 var(--rule); min-width: 0; }
.kv > div:last-child { box-shadow: none; }
.kv .placard { display: block; margin-bottom: 4px; }
.kv .v { font: 600 14px/18px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kv .v.pro { font: 600 14px/18px var(--font); }

/* Drop zone (File Transcription) */
.drop { position: relative; height: 220px; display: grid; place-items: center; text-align: center; background: var(--field); }
.drop::before { content: ""; position: absolute; inset: 0; border: 1.5px dashed var(--grat); }
.drop.over::before { border-color: var(--accent); border-style: solid; }
.drop h3 { margin: 10px 0 4px; font: 600 17px/22px var(--font); }
.drop p { margin: 0 0 16px; font: 400 13px/18px var(--font); color: var(--text-2); }
.drop svg.ic { width: 36px; height: 36px; color: var(--text-2); }

/* Playground */
.play { box-shadow: inset 0 0 0 1px var(--rule); }
.play .area { min-height: 170px; box-shadow: none; background: transparent; font-size: 16px; line-height: 25px; padding: 18px 20px; }
.play .area:focus { box-shadow: inset 0 0 0 1.5px var(--ink); }

/* Overlay reference: a static copy of the round 6 pill with its rails, on a terminal-coloured plate */
.ovref { position: relative; padding: 30px 0 34px; display: grid; place-items: center; background: #0D0F14; box-shadow: inset 0 0 0 1px var(--rule); }
:root[data-theme="light"] .ovref { background: #E9EAEC; }
.ovref .ovcap { position: absolute; left: 14px; top: 10px; font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.58); }
:root[data-theme="light"] .ovref .ovcap { color: #111214; }
.ov { display: flex; align-items: flex-end; gap: 6px; }
.ov-rail { width: 30px; height: 130px; display: flex; flex-direction: column; justify-content: space-evenly; }
.ov-chip { position: relative; width: 30px; height: 30px; background: var(--chip); color: rgba(255,255,255,.85); display: grid; place-items: center; }
:root[data-theme="light"] .ov-chip { color: #111214; }
.ov-chip svg { width: 16px; height: 16px; }
.ov-chip .tk { --tk-gap: 2px; --tk-len: 6px; }
.ov-chip:hover .tk { opacity: 1; }
.ov-pill { width: 340px; height: 130px; padding: 10px 12px 8px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--edge), var(--drop), 0 9px 36px rgba(0,0,0,.55); display: flex; flex-direction: column; }
:root[data-theme="light"] .ov-pill { box-shadow: inset 0 0 0 1px var(--edge), var(--drop), 0 5px 24px rgba(0,0,0,.16); }
.ov-prev { height: 48px; overflow: hidden; font: 500 12.5px/16px var(--font); color: var(--text); display: flex; flex-direction: column; justify-content: flex-end; }
.ov-prev.dim { color: var(--text-dim); }
.ov-trow { margin-top: 6px; height: 38px; display: flex; align-items: flex-start; }
.ov-trow canvas { display: block; width: 250px; height: 38px; }
.ov-read { margin-left: auto; margin-top: 8px; height: 18px; display: flex; align-items: center; gap: 4px; font: 600 14px/18px var(--mono); color: var(--text); }
.ov-read .t { width: 5ch; text-align: right; }
.ov-foot { position: relative; margin-top: 4px; height: 16px; display: flex; justify-content: center; align-items: center; gap: 7px; }
.ov-foot .mic, .ov-foot .wc, .ov-foot .wpm { font: 500 10px/16px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); white-space: pre; }
.ov-foot .wc { position: absolute; left: 0; } .ov-foot .wpm { position: absolute; right: 0; }

/* =====================================================================================
   ONBOARDING WIZARD: a separate square window, a step rail on the left like a drawing's
   revision block, content right, a ruled foot with Back / primary.
   ===================================================================================== */
.scrim { position: fixed; inset: 26px 0 0 0; z-index: 30; display: none; place-items: center; background: rgba(0,0,0,.45); }
:root[data-theme="light"] .scrim { background: rgba(217,218,221,.7); }
.scrim.on { display: grid; }
.wiz { width: 880px; height: 620px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--edge), var(--drop), var(--float); display: grid; grid-template-rows: 40px 1fr 72px; }
.wiz .titlebar { grid-template-columns: 240px 1fr auto; }
.wiz-body { display: grid; grid-template-columns: 240px 1fr; min-height: 0; }
.wiz-rail { background: var(--sidebar); box-shadow: inset -1px 0 0 var(--edge); padding: 22px 0; display: flex; flex-direction: column; }
.wiz-rail .ws { height: 44px; display: grid; grid-template-columns: 56px 1fr auto; align-items: center; padding-right: 18px; color: var(--text-2); }
.wiz-rail .ws .n { font: 600 12px/1 var(--mono); padding-left: 22px; }
.wiz-rail .ws .t { font: 500 13px/1 var(--font); }
.wiz-rail .ws .s { font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.wiz-rail .ws.done { color: var(--text); }
.wiz-rail .ws.on { background: var(--inv-bg); color: var(--inv-fg); }
.wiz-rail .grow { flex: 1; }
.wiz-rail .legend { padding: 0 22px; font: 500 10px/15px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.wiz-page { display: none; padding: 34px 40px; overflow-y: auto; min-height: 0; }
.wiz-page.on { display: block; }
.wiz-page h1 { margin: 6px 0 8px; font: 600 28px/32px var(--font); letter-spacing: -.01em; }
.wiz-page .lede { margin: 0 0 24px; font: 400 15px/22px var(--font); color: var(--text-2); max-width: 500px; }
.wiz-foot { display: grid; grid-template-columns: 240px 1fr auto; align-items: center; box-shadow: inset 0 1px 0 var(--edge); }
.wiz-foot .pg { padding-left: 22px; font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); height: 100%; display: flex; align-items: center; box-shadow: inset -1px 0 0 var(--edge); }
.wiz-foot .pg b { color: var(--text); }
.wiz-foot .r { display: flex; align-items: center; gap: 18px; padding: 0 28px; }
.wiz-foot .l { padding-left: 28px; }

/* the app mark, drawn (icon variant A) */
.mark { width: 64px; height: 64px; background: #111214; position: relative; box-shadow: inset 0 0 0 1px #2C2E33; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* =====================================================================================
   ROUND-SPECIFIC PIECES
   ===================================================================================== */
/* At-rest brackets read a step quieter than hover brackets, so hover still answers the pointer. */
.bk.tk-rest > .tk:not(.tk-halo) { opacity: .62; }
.bk.tk-rest:hover > .tk:not(.tk-halo), .bk.tk-rest.is-hover > .tk:not(.tk-halo) { opacity: 1; }
.btn.flat { height: 100%; min-width: 180px; }
.btn.flat > .tk { display: none; }
.inv { display: inline-block; padding: 3px 6px; background: var(--inv-bg); color: var(--inv-fg); font: 600 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.tog-spacer { display: inline-block; width: 73px; }

/* Settings zone strip: a drawing's zone index, sticky under the pane's top edge */
.zones { position: sticky; top: 0; z-index: 5; display: flex; margin: -8px 0 26px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule), 0 -12px 0 var(--surface); }
.zones a { flex: 1; height: 34px; display: flex; align-items: center; justify-content: center; gap: 6px; font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); text-decoration: none; }
.zones a + a { box-shadow: inset 1px 0 0 var(--rule); }
.zones a b { color: var(--text); font-weight: 600; }
.zones a:hover { background: var(--inv-bg); color: var(--inv-fg); }
.zones a:hover b { color: var(--inv-fg); }
.sec > h2 .zl { display: inline-grid; place-items: center; width: 20px; height: 20px; background: var(--inv-bg); color: var(--inv-fg); }
.sec { scroll-margin-top: 50px; }

/* tags (filler words) */
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { height: 28px; display: inline-flex; align-items: center; gap: 8px; padding: 0 4px 0 10px; font: 500 12px/1 var(--mono); color: var(--text); background: var(--chip); }
.tag button { width: 20px; height: 20px; font: 500 14px/1 var(--mono); color: var(--text-2); }
.tag button:hover { background: var(--inv-bg); color: var(--inv-fg); }

/* numbered instruction list */
.olist { list-style: none; margin: 18px 0 0; padding: 0; box-shadow: inset 0 0 0 1px var(--rule-soft); }
.olist li { display: grid; grid-template-columns: 44px 1fr; padding: 10px 14px 10px 0; font: 400 13px/18px var(--font); color: var(--text); box-shadow: inset 0 -1px 0 var(--rule-soft); }
.olist li:last-child { box-shadow: none; }
.olist li b { font: 600 10px/18px var(--mono); color: var(--text-2); text-align: center; }

/* readiness: three cells that fill, a big mono count */
.readiness { padding-left: 24px; box-shadow: inset 1px 0 0 var(--rule-soft); }
.r3 { display: flex; gap: 4px; margin: 10px 0 8px; }
.r3 i { flex: 1; height: 14px; box-shadow: inset 0 0 0 1px var(--edge); }
.r3 i.f { background: var(--ink); box-shadow: none; }
.readiness .big { font: 600 40px/44px var(--mono); }
.readiness .big span { font-size: 18px; color: var(--text-2); }
.readiness p { margin: 4px 0 0; font: 400 13px/18px var(--font); color: var(--text-2); }

/* command mode chat */
.chat .msgs { padding: 18px 20px; display: grid; gap: 14px; }
.msg { max-width: 560px; }
.msg.me { justify-self: end; text-align: right; }
.msg p { margin: 4px 0 0; font: 400 14px/20px var(--font); }
.msg.me p { display: inline-block; padding: 8px 12px; background: var(--chip); text-align: left; }
.msg pre, .confirm pre { margin: 8px 0; padding: 10px 12px; font: 400 12px/18px var(--mono); color: var(--text); background: var(--field); box-shadow: inset 0 0 0 1px var(--rule-soft); white-space: pre; overflow-x: auto; user-select: text; }
.msg code { font: 500 12.5px/1 var(--mono); }
.confirm { position: relative; padding: 16px 18px; box-shadow: inset 0 0 0 1px var(--edge); }
.confirm .rule { position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--accent); }

/* file transcription segments */
.segs { padding: 6px 0; }
.segs .sg { display: grid; grid-template-columns: 110px 90px 1fr; padding: 12px 18px; box-shadow: inset 0 -1px 0 var(--rule-soft); }
.segs .sg:last-child { box-shadow: none; }
.segs .who { font: 600 10px/20px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.segs .ts { font: 500 11px/20px var(--mono); color: var(--text-2); }
.segs p { margin: 0; font: 400 14px/20px var(--font); user-select: text; }

/* history fills the pane edge to edge */
.screen.flush { padding: 0; max-width: none; height: 100%; }
.screen.flush.on { display: block; }
.screen.flush > .hist { height: 100%; }
.hist-foot { flex: none; height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; box-shadow: inset 0 1px 0 var(--rule), inset -1px 0 0 var(--rule); font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.hist-foot b { color: var(--text); }

/* milestones: a row per track, cells invert once earned; the next one is outlined in ink */
.ms { box-shadow: inset 0 0 0 1px var(--rule); }
.ms-row { display: grid; grid-template-columns: 150px repeat(6, 1fr); align-items: stretch; box-shadow: inset 0 -1px 0 var(--rule); }
.ms-row:last-child { box-shadow: none; }
.ms-row .placard { display: flex; align-items: center; padding: 0 16px; box-shadow: inset -1px 0 0 var(--rule); }
.ms-cell { height: 44px; display: grid; place-items: center; font: 600 13px/1 var(--mono); color: var(--text-dim); box-shadow: inset -1px 0 0 var(--rule-soft); }
.ms-cell.got { background: var(--inv-bg); color: var(--inv-fg); box-shadow: inset -1px 0 0 var(--surface); }
.ms-cell.next { color: var(--text); box-shadow: inset 0 0 0 1.5px var(--ink); }

/* wizard pieces */
.bars2 { display: grid; grid-template-columns: 70px auto 1fr; gap: 6px 10px; align-items: center; margin-top: 10px; }
.bars2 .mono { font: 600 11px/1 var(--mono); }
.lvl { display: inline-flex; gap: 2px; }
.lvl i { width: 4px; height: 14px; background: var(--rule-soft); }
.lvl i.f { background: var(--ink); }
.lvl i.hot { background: var(--accent); }
.bigkey { display: inline-grid; place-items: center; min-width: 140px; height: 84px; padding: 0 18px; font: 600 22px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; background: var(--chip); box-shadow: inset 0 0 0 1.5px var(--ink), 0 4px 0 var(--ink); }
.wiz .ccard .ix { font-weight: 600; }
.pane.flush { overflow: hidden; }
.titlebar .status > span.tcell:hover { background: var(--inv-bg); color: var(--inv-fg); }
.titlebar .status > span.tcell:hover b { color: var(--inv-fg); }
[hidden] { display: none !important; }
.hist { grid-template-columns: 380px minmax(0, 1fr); }
.hist-detail { min-width: 0; }
.hist-detail .dh { grid-template-columns: repeat(6, auto) 1fr; }
.hrow { grid-template-columns: 70px 1fr; }
.hist-scroll .day { height: 28px; display: flex; align-items: center; padding: 0 16px; font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); background: var(--sidebar); box-shadow: inset 0 -1px 0 var(--rule), inset -1px 0 0 var(--rule); }
.tr .stat { color: var(--c1); }
.tr .sq.ink { background: var(--c1); }
.tr .sq.off { box-shadow: inset 0 0 0 1px var(--c2); }
.head + .sec, .head + .zones + .sec { margin-top: 0; }
.sec:first-of-type { margin-top: 34px; }
.head + .sec:first-of-type, .head + .zones + .sec:first-of-type { margin-top: 0; }
.box + .sec, #eprev-slot + .sec { margin-top: 34px; }
.hist-detail .dh { grid-template-columns: repeat(5, 1fr); }
.hist-detail .dh > div { padding: 12px 16px; min-width: 0; }
.hist-detail .acts { padding: 0 24px; gap: 12px; }
.hist-detail .acts > * { flex: none; }
.btn, .btn2 { flex: none; }
.chart .bars { gap: 0; }
.chart .bars .c { flex: 1; height: 100%; display: flex; justify-content: center; align-items: flex-end; }
.chart .bars .c i { flex: none; width: 46%; max-width: 64px; }
.chart .bars.dense .c i { width: 62%; }
.chart .xl { gap: 0; }
.wiz { width: 980px; height: 680px; }
.wiz-body { grid-template-columns: 240px minmax(0, 1fr); }
.wiz-body > div { min-width: 0; position: relative; }
.wiz-page { position: absolute; inset: 0; }
.scrim { background: var(--desk) !important; }
.wiz .step .r .stat { width: auto; }
.tbtn { white-space: nowrap; }
.wiz .ccard .top { min-height: 22px; }
.wiz .lights i:nth-child(1) { background: #FF5F57; } .wiz .lights i:nth-child(2) { background: #FEBC2E; } .wiz .lights i:nth-child(3) { background: #28C840; }
.tog { width: 74px; }
.tog-spacer { width: 74px; }
.menu .mi.is-hover { background: var(--inv-bg); color: var(--inv-fg); }
.menu .mi.is-hover kbd, .menu .mi.is-hover em, .menu .mi.is-hover svg { color: var(--inv-fg-2); }

</style>
</head>

<script>
// SF Symbol stand-ins, 16 grid, 1.5 stroke, square caps where the symbol allows.
const S = (d, extra = "") => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" ${extra}>${d}</svg>`;
const G = {

  gear: S('<circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/>'),
  chev: '<svg width="8" height="10" viewBox="0 0 8 10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 1.5L6 5 2.5 8.5"/></svg>',
  speaker: S('<path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11.5 5.5a3.5 3.5 0 0 1 0 5"/>'),

const TK = '<span class="tk tk-halo" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="tk" aria-hidden="true"><i></i><i></i><i></i><i></i></span>';
const MB_BRACKET = '<path class="mb-bracket" d="M0.75 4.75V0.75H4.75M17.25 0.75H21.25V4.75M21.25 11.25V15.25H17.25M4.75 15.25H0.75V11.25" fill="none" stroke="currentColor" stroke-width="1.5"/>';
function mbGlyph(kind, hs) {
  const bars = (hs || [6, 10, 7]).map((h, i) => `M${4 + i * 3} ${8 - h / 2}h2v${h}h-2Z`).join("");
  const sq = kind === "listening" ? '<rect x="14" y="5" width="6" height="6"/>' : kind === "transcribing" ? '<rect x="14.75" y="5.75" width="4.5" height="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/>' : "";
  return `<svg width="22" height="16" viewBox="0 0 22 16" fill="currentColor" aria-hidden="true">${MB_BRACKET}<path d="${bars}"/>${sq}</svg>`;

// App icon, variant A (icon.html): ink tile on a 32 grid, five white bars, one orange 6 x 6 square.
function appMark(size) {
  const bars = [[5, 6], [8, 12], [11, 8], [14, 12], [17, 6]].map(([x, h]) => `<rect x="${x}" y="${16 - h / 2}" width="2" height="${h}"/>`).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 32 32" shape-rendering="crispEdges"><rect width="32" height="32" fill="#111214"/><g fill="#fff">${bars}</g><rect x="21" y="16" width="6" height="6" fill="#FF4F1F"/></svg>`;

// ===================================================================================
// Screens. Every string and control below comes from the SwiftUI inventory
// (Sources/Fluid/UI, ContentView.swift, MenuBarManager.swift). Built as templates so
// the markup stays readable; behaviour lives in app.js.
// ===================================================================================
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- control templates ----------
const tog = (on, o = {}) => `<button class="tog bk${o.off ? " off" : ""}" role="switch" aria-checked="${on}"${o.reveals ? ` data-reveals="${o.reveals}"` : ""}><span class="sw"></span><span class="w">${on ? "ON" : "OFF"}</span></button>`;
const seg = (opts, cur, o = {}) => `<div class="seg bk${o.pro ? " pro" : ""}"${o.group ? ` data-group="${o.group}"` : ""}${o.w ? ` style="--sw:${o.w}"` : ""}>${opts.map((x) => { const [v, l] = Array.isArray(x) ? x : [x, x]; return `<button data-v="${v}" aria-pressed="${v === cur}"${o.w ? ` style="min-width:${o.w}px"` : ""}>${l}</button>`; }).join("")}</div>`;
const pick = (v, opts, o = {}) => `<button class="pick bk${o.cls ? " " + o.cls : ""}" data-opts="${opts.join("|")}"${o.head ? ` data-head="${o.head}"` : ""}><span class="v">${v}</span>${o.m ? `<span class="m">${o.m}</span>` : ""}</button>`;
const caps = (keys) => keys.map((k) => `<span class="cap">${k}</span>`).join("");
const hk = (keys, o = {}) => `<div class="hk bk" title="Click to record a new shortcut">${keys.length ? caps(keys) : '<span class="placard" style="padding-left:6px">Not set</span>'}<span class="rec"><i class="sq"></i>Press shortcut…</span>${o.x ? `<span class="x">${o.x}</span>` : ""}</div>`;
const btn = (label, o = {}) => `<button class="btn bk${o.rest === false ? "" : " tk-rest"}${o.live ? " live" : ""}${o.lg ? " lg" : ""}${o.cls ? " " + o.cls : ""}"${o.id ? ` id="${o.id}"` : ""}${o.attr ? " " + o.attr : ""}${o.dis ? " disabled" : ""}><span class="a">${o.icon ? G[o.icon] : ""}${label}${o.k ? `<span class="k">${o.k}</span>` : ""}</span>${o.b ? `<span class="b" style="visibility:hidden">${o.bicon ? G[o.bicon] : ""}${o.b}</span>` : ""}</button>`;
const btn2 = (label, o = {}) => `<button class="btn2 bk${o.sm ? " sm" : ""}"${o.attr ? " " + o.attr : ""}><span>${o.icon ? G[o.icon] : ""}${label}</span></button>`;
const tbtn = (label, o = {}) => `<button class="tbtn bk${o.accent ? " accent" : ""}"${o.attr ? " " + o.attr : ""}>${o.icon ? G[o.icon] : ""}${label}</button>`;
const stat = (word, sq = "ink", dim) => `<span class="stat${dim ? " dim" : ""}"><i class="sq ${sq}"></i>${word}</span>`;
const sld = (pct, val, o = {}) => {
  const ticks = Array.from({ length: 21 }, (_, i) => `<i class="${i % 5 === 0 ? "maj" : ""}" style="left:${i * 5}%"></i>`).join("");
  return `<div class="sld bk">${o.lo ? `<span class="placard">${o.lo}</span>` : ""}<div class="trk"><span class="line"></span><span class="fill" style="width:${pct}%"></span><span class="ticks">${ticks}</span><span class="th" style="left:${pct}%"></span></div>${o.hi ? `<span class="placard">${o.hi}</span>` : ""}<span class="val">${val}</span></div>`;
};
const meter = (pct) => `<span class="meter" title="${pct}%">${Array.from({ length: 10 }, (_, i) => `<i class="${i < Math.round(pct / 10) ? "f" : ""}"></i>`).join("")}</span>`;
const row = (lbl, help, ctl, o = {}) => `<div class="row${o.sub ? " sub" : ""}${o.dim ? " dim" : ""}"${o.dep ? ` data-dep="${o.dep}"` : ""}><div><div class="lbl">${lbl}</div>${help ? `<div class="help">${help}</div>` : ""}</div><div class="ctl">${ctl}</div></div>`;
const sec = (title, body, o = {}) => `<section class="sec"${o.id ? ` id="${o.id}"` : ""}><h2>${o.zone ? `<span class="zl">${o.zone}</span>` : ""}${title}${o.r ? `<span class="r">${o.r}</span>` : ""}</h2>${o.note ? `<p class="note">${o.note}</p>` : ""}${body}</section>`;
const head = (ix, title, sub, act = "") => `<div class="head"><div><div class="placard">${ix}</div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ""}</div><div class="act">${act}</div></div>`;

// ---------- data ----------
const MICS = ["Hollyland Lapel Mic", "MacBook Pro Microphone", "AirPods Pro", "Studio Display Microphone"];
const ENGINES = [

  const st = { active: stat("Active"), installed: btn2("Activate", { sm: 1 }), none: '<span class="m">Not downloaded</span>', builtin: btn2("Activate", { sm: 1 }), dl: `<span style="display:grid;gap:6px;width:110px"><span class="m" style="display:flex;justify-content:space-between"><span>Downloading</span><b style="color:var(--c1)">64%</b></span><span class="prog"><i style="width:64%"></i></span></span>` }[e.state];
  return `<div class="tr erow${e.state === "active" ? " on" : ""}" data-e="${i}" style="grid-template-columns:22px 1fr 96px 132px 76px 76px 128px;min-height:56px">
    <span>${e.state === "active" ? '<i class="sq"></i>' : e.state === "dl" ? '<i class="sq hollow"></i>' : e.state === "none" ? "" : '<i class="sq off"></i>'}</span>
    <span><span style="font-weight:600;display:block">${esc(e.name)}</span><span class="m">${esc(e.tech)}</span></span>
    <span class="m">${e.size}</span><span class="m">${e.lang}</span>
    <span class="m" style="display:flex;gap:6px;align-items:center"><span style="width:3ch;text-align:right">${e.sp}</span></span>
    <span class="m" style="display:flex;gap:6px;align-items:center"><span style="width:3ch;text-align:right">${e.acc}</span></span>
    <span style="display:flex;justify-content:flex-end">${st}</span></div>`;
}
function enginePreview(e) {
  const action = e.state === "active" ? `<span class="stat" style="height:36px"><i class="sq"></i>Active now</span>` : e.state === "none" ? btn("Download &amp; Activate", { icon: "down" }) : e.state === "dl" ? btn2("Cancel") : btn("Activate");
  return `<div class="box eprev">
    <header><span><b>Preview</b> · ${e.prov}</span><span>${e.badge ? `<span class="inv">${e.badge}</span>` : ""}</span></header>
    <div style="padding:20px 22px 18px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start">
      <div><div style="font:600 22px/27px var(--font)">${esc(e.name)}</div><div class="placard" style="margin-top:4px">${esc(e.tech)}</div><p style="margin:10px 0 0;font:400 14px/20px var(--font);color:var(--text-2);max-width:520px">${esc(e.desc)}</p>${e.warn ? `<p class="placard" style="margin-top:10px;color:var(--accent)">${esc(e.warn)}</p>` : ""}</div>
      <div style="padding-top:4px">${action}</div>
    </div>
    <div class="kv" style="box-shadow:inset 0 1px 0 var(--rule)">
      <div><span class="placard">Download size</span><span class="v">${e.size}</span></div>
      <div><span class="placard">Languages</span><span class="v">${e.lang}</span></div>
      <div><span class="placard">Speed</span><span class="v" style="display:flex;gap:10px;align-items:center">${meter(e.sp)}<span>${e.sp}%</span></span></div>
      <div><span class="placard">Accuracy</span><span class="v" style="display:flex;gap:10px;align-items:center">${meter(e.acc)}<span>${e.acc}%</span></span></div>
      <div><span class="placard">Runs on</span><span class="v">${e.prov === "Apple" ? "macOS" : "Apple Silicon"}</span></div>
    </div>
    ${e.words ? `<div style="display:flex;align-items:center;gap:14px;padding:12px 22px;box-shadow:inset 0 1px 0 var(--rule)"><span class="placard"><b>Custom Words</b></span><span style="font:400 13px/18px var(--font);color:var(--text-2);flex:1">Custom Words supported on Parakeet. Teach names, product terms, and uncommon words for better accuracy.</span>${tbtn("Open Custom Dictionary", { icon: "arrowR", attr: 'data-go="dict"' })}</div>` : ""}
  </div>`;
}
function sEngine() {
  const th = `<div class="th" style="grid-template-columns:22px 1fr 96px 132px 76px 76px 128px"><span></span><span>Model</span><span>Size</span><span>Languages</span><span>Speed</span><span>Acc</span><span style="text-align:right">State</span></div>`;
  return head("02 / Configure", "Voice Engine", "Click a row to preview. Press Activate to load the model.",
    `<span class="placard">Filter</span>${pick("All", ["All", "NVIDIA", "Apple", "Cohere", "OpenAI"], { cls: "w-sm" })}<span class="placard">Sort</span>${pick("Provider", ["Provider", "Accuracy", "Speed"], { cls: "w-sm" })}`) +
    `<div id="eprev-slot">${enginePreview(ENGINES[0])}</div>` +
    sec("Active Model", `<div class="tbl">${th}${engineRow(ENGINES[0], 0)}</div>`, { r: "Loaded · will stay warm" }) +
    sec("Other Models", `<div class="tbl">${th}${ENGINES.slice(1).map((e, i) => engineRow(e, i + 1)).join("")}</div>`, { r: "13 models · 4 on this Mac" }) +

// =================================================================================== 06 HISTORY (full bleed)
function sHistory() {
  let lastDay = "";

  return `<div class="hist" data-empty="off">
    <div class="hist-list">
      <div class="hist-tools"><label class="field bk" style="width:100%">${G.search}<input placeholder="Search transcriptions..."><kbd>⌘F</kbd></label></div>
      <div class="hist-scroll">${rows}</div>
      <div class="hist-foot"><span><b>247</b> entries · newest first</span>${tbtn("Clear All")}</div>
    </div>
    <div class="hist-detail" id="hist-detail"></div>
  </div>
  <div data-empty="on" hidden style="padding:30px 40px">${head("06 / Activity", "History", "")}<div class="empty" style="height:440px"><div class="card"><span class="placard">00 entries</span><h3>No History Yet</h3><p>Your transcriptions will appear here. Press Right ⌥ anywhere and start talking.</p>${btn("Open Playground", { icon: "arrowR", attr: 'data-go="start"' })}</div></div></div>`;
}

// ===================================================================================
// Behaviour: navigation, theme, toggles, segments, pickers, hotkey capture, the
// overlay reference trace, the menu bar menu, the onboarding wizard.
// ===================================================================================
(function () {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const root = document.documentElement;

  // ---------- theme: follows prefers-color-scheme until T overrides it ----------
  const mq = matchMedia("(prefers-color-scheme: light)");
  let themeOverride = null;
  try { themeOverride = localStorage.getItem("mk-theme"); } catch (e) {}
  const params = new URLSearchParams(location.search);
  if (params.get("theme")) themeOverride = params.get("theme");
  function applyTheme() {
    root.dataset.theme = themeOverride || (mq.matches ? "light" : "dark");
    $("#theme-word").textContent = (themeOverride ? "" : "System · ") + (root.dataset.theme === "light" ? "Light" : "Dark");
    drawTraces();
  }
  mq.addEventListener("change", applyTheme);
  function toggleTheme() {
    themeOverride = root.dataset.theme === "light" ? "dark" : "light";
    try { localStorage.setItem("mk-theme", themeOverride); } catch (e) {}
    applyTheme();
  }

  // ---------- inject brackets into every .bk ----------
  function bracketize(scope = document) {
    $$(".bk", scope).forEach((el) => { if (!el.querySelector(":scope > .tk")) el.insertAdjacentHTML("afterbegin", TK); });
  }

  // ---------- navigation ----------
  function go(id) {
    $$(".nav").forEach((n) => n.classList.toggle("on", n.dataset.go === id));
    $$(".screen").forEach((s) => s.classList.toggle("on", s.id === "s-" + id));
    const nav = $(`.nav[data-go="${id}"]`);
    if (nav) $("#crumb-ix").textContent = nav.querySelector(".ix").textContent, $("#crumb-t").textContent = nav.querySelector(".t").textContent;
    const sec = nav && nav.closest("[data-sec]");
    $("#crumb-sec").textContent = sec ? sec.dataset.sec : "";
    $(".pane").scrollTop = 0;
    try { localStorage.setItem("mk-screen", id); } catch (e) {}
    $(".pane").classList.toggle("flush", id === "history");
    drawTraces();
  }
  document.addEventListener("click", (e) => {
    const n = e.target.closest("[data-go]");
    if (n) { e.preventDefault(); go(n.dataset.go); closeMenus(); }
  });

  // ---------- toggles ----------
  document.addEventListener("click", (e) => {
    const t = e.target.closest(".tog");
    if (!t || t.classList.contains("off")) return;
    const on = t.getAttribute("aria-checked") !== "true";
    t.setAttribute("aria-checked", on);
    t.querySelector(".w").textContent = on ? "ON" : "OFF";
    const dep = t.dataset.reveals && $$(`[data-dep="${t.dataset.reveals}"]`);
    if (dep) dep.forEach((d) => d.classList.toggle("dim", !on), dep.forEach((d) => d.querySelectorAll(".tog,.seg button,.pick").forEach((c) => c.classList.toggle("off", !on))));
  });

  // ---------- segmented ----------
  document.addEventListener("click", (e) => {
    const b = e.target.closest(".seg button");
    if (!b || b.classList.contains("off")) return;
    b.parentElement.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    const g = b.parentElement.dataset.group;
    if (g) $$(`[data-pane-of="${g}"]`).forEach((p) => (p.hidden = p.dataset.pane !== b.dataset.v));
  });

  // ---------- choice cards (one chosen per group; the chosen card carries brackets at rest) ----------
  document.addEventListener("click", (e) => {
    const c = e.target.closest(".ccard[data-group]");
    if (!c || e.target.closest("button:not(.ccard)")) return;
    $$(`.ccard[data-group="${c.dataset.group}"]`).forEach((x) => { x.classList.toggle("on", x === c); x.classList.toggle("tk-rest", x === c); });
    if (c.dataset.group === "engine") { $$("[data-engine-name]").forEach((el) => (el.textContent = c.dataset.name)); }
  });

  // ---------- pickers: a square menu under the field ----------
  const pmenu = document.createElement("div");
  pmenu.className = "menu"; document.body.appendChild(pmenu);
  let pickFor = null;
  document.addEventListener("click", (e) => {
    const p = e.target.closest(".pick");
    const item = e.target.closest(".menu .mi[data-v]");
    if (item && pickFor) {
      pickFor.querySelector(".v").textContent = item.dataset.v;
      closeMenus(); return;
    }
    if (p && !p.classList.contains("off")) {
      e.stopPropagation();
      if (pickFor === p) { closeMenus(); return; }
      closeMenus();
      pickFor = p;
      const cur = p.querySelector(".v").textContent;
      const opts = (p.dataset.opts || "").split("|");
      pmenu.innerHTML = (p.dataset.head ? `<div class="mh"><span>${p.dataset.head}</span></div><div class="sep"></div>` : "") +
        opts.map((o) => o === "-" ? '<div class="sep"></div>' : `<div class="mi" data-v="${o}"><span class="ck">${o === cur ? "✓" : ""}</span><span>${o}</span></div>`).join("");
      const r = p.getBoundingClientRect();
      pmenu.style.left = r.left + "px"; pmenu.style.top = r.bottom + 4 + "px"; pmenu.style.minWidth = r.width + "px";
      pmenu.classList.add("open"); p.classList.add("is-hover");
      return;
    }
    if (!e.target.closest(".menu") && !e.target.closest(".mb-mark")) closeMenus();
  });
  function closeMenus() {
    pmenu.classList.remove("open"); if (pickFor) pickFor.classList.remove("is-hover"); pickFor = null;
    $("#mbmenu").classList.remove("open"); $(".mb-mark").classList.remove("open"); $$("#mbmenu .mi.is-hover").forEach((m) => m.classList.remove("is-hover"));
    $$(".mic-sub").forEach((m) => m.classList.remove("open"));
  }

  // ---------- hotkey capture ----------
  let capturing = null;
  document.addEventListener("click", (e) => {
    const h = e.target.closest(".hk");
    if (h && !e.target.closest(".x")) {
      if (capturing && capturing !== h) capturing.classList.remove("capturing");
      capturing = h.classList.toggle("capturing") ? h : null;
    } else if (capturing && !h) { capturing.classList.remove("capturing"); capturing = null; }
  });
  const KEYNAME = { " ": "Space", Escape: "Esc", Enter: "Return", ArrowUp: "↑", ArrowDown: "↓", ArrowLeft: "←", ArrowRight: "→", Backspace: "⌫", Tab: "Tab" };
  function captureKey(e) {
    if (!capturing) return false;
    e.preventDefault(); e.stopPropagation();
    if (["Meta", "Alt", "Shift", "Control"].includes(e.key)) return true;
    const caps = [];
    if (e.ctrlKey) caps.push("⌃"); if (e.altKey) caps.push("⌥"); if (e.shiftKey) caps.push("⇧"); if (e.metaKey) caps.push("⌘");
    caps.push(KEYNAME[e.key] || (e.code.startsWith("F") && e.code.length <= 3 ? e.code : e.key.toUpperCase()));
    capturing.querySelectorAll(".cap").forEach((c) => c.remove());
    capturing.querySelector(".rec").insertAdjacentHTML("beforebegin", caps.map((c) => `<span class="cap">${c}</span>`).join(""));
    capturing.classList.remove("capturing"); capturing = null;
    return true;
  }

  // ---------- menu bar menu ----------
  $(".mb-mark").addEventListener("click", (e) => {
    e.stopPropagation();
    const m = $("#mbmenu"), open = !m.classList.contains("open");
    closeMenus();
    if (open) { m.classList.add("open"); $(".mb-mark").classList.add("open"); const r = $(".mb-mark").getBoundingClientRect(); m.style.left = Math.min(innerWidth - m.offsetWidth - 8, r.left) + "px"; m.style.top = r.bottom + 2 + "px"; }
  });
  document.addEventListener("mouseover", (e) => {
    const mi = e.target.closest("#mbmenu .mi");
    if (!mi) return;
    const sub = $("#micsub");
    if (mi.dataset.sub === "mic") {
      const r = mi.getBoundingClientRect();
      sub.style.left = (r.right + 4 + 260 > innerWidth ? r.left - sub.offsetWidth - 4 : r.right + 4) + "px"; sub.classList.add("open"); sub.style.top = r.top - 5 + "px"; sub.style.left = (r.right + 4 + sub.offsetWidth > innerWidth ? r.left - sub.offsetWidth - 4 : r.right + 4) + "px";
    } else if (!e.target.closest("#micsub")) sub.classList.remove("open");
  });
  $("#mbmenu").addEventListener("click", (e) => {
    const mi = e.target.closest(".mi"); if (!mi) return;
    if (mi.dataset.act === "settings") go("prefs");
    if (mi.dataset.act === "history") go("history");
    if (mi.dataset.act === "toggle") toggleRec();
    if (mi.dataset.sub !== "mic") closeMenus();
  });
  $("#micsub").addEventListener("click", (e) => {
    const mi = e.target.closest(".mi"); if (!mi) return;
    $$("#micsub .mi .ck").forEach((c) => (c.textContent = ""));
    mi.querySelector(".ck").textContent = "✓";
    $("#mb-mic").textContent = mi.dataset.v; closeMenus();
  });

  // ---------- history list selection ----------
  document.addEventListener("click", (e) => {
    const r = e.target.closest(".hrow");
    if (!r) return;
    $$(".hrow").forEach((x) => x.classList.toggle("on", x === r));
    window.HIST_SELECT && window.HIST_SELECT(+r.dataset.i);
  });

  // ---------- the overlay reference: a round 6 pill with a canvas trace ----------
  const N = 63, PITCH = 4, BAR = 2, H = 34, MID = 17, HMIN = 2, HMAX = 30;
  const sample = (i) => { const v = Math.abs(Math.sin(i * 0.61) * 0.55 + Math.sin(i * 0.23 + 1) * 0.35 + Math.sin(i * 1.7) * 0.2); return i % 17 < 3 ? 0 : v; };
  let phase = 0, rec = false, recT0 = 0, raf = 0;
  function drawTraces() {
    $$(".ov-trace").forEach((cv) => {
      const dpr = Math.max(1, Math.round(devicePixelRatio || 1));
      const W = N * PITCH - 2;
      if (cv.width !== W * dpr) { cv.width = W * dpr; cv.height = 38 * dpr; cv.style.width = W + "px"; }
      const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, 38);
      const cs = getComputedStyle(root);
      const ink = cs.getPropertyValue("--ink").trim(), acc = cs.getPropertyValue("--accent").trim(), mid = cs.getPropertyValue("--midline").trim(), grat = cs.getPropertyValue("--grat").trim();
      ctx.fillStyle = mid; ctx.fillRect(0, MID, W, 1);
      const live = cv.dataset.live === "1" ? rec : true;
      for (let i = 0; i < N; i++) {
        const v = live ? sample(i + phase) : 0;
        const h = Math.max(HMIN, Math.round((HMIN + v * (HMAX - HMIN)) / 2) * 2);
        ctx.fillStyle = live && i >= N - 6 ? acc : ink;
        ctx.fillRect(i * PITCH, MID - h / 2 + 0.5, BAR, h);
      }
      ctx.fillStyle = grat;
      for (let i = 0; i < N; i++) { if (i % 3 === 0) ctx.fillRect(i * PITCH, 35, 1, i % 12 === 0 ? 3 : 2); }
    });
  }
  function tick(t) {
    if (!rec) return;
    phase = Math.floor((t - recT0) / 83.3);
    const s = Math.floor((t - recT0) / 1000);
    $$(".ov-live-t").forEach((el) => (el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`));
    const words = Math.min(9999, Math.floor((t - recT0) / 1000 * 2.7));
    $$(".ov-live-wc").forEach((el) => (el.textContent = String(words).padStart(4, " ") + " WORDS"));
    const wpm = Math.round(words * 60 / Math.max(6, (t - recT0) / 1000));
    $$(".ov-live-wpm").forEach((el) => (el.textContent = String(wpm).padStart(3, " ") + " WPM"));
    const txt = PLAY_TEXT.split(" ").slice(0, words).join(" ");
    $$(".ov-live-prev").forEach((el) => (el.textContent = txt || " "));
    drawTraces();
    raf = requestAnimationFrame(tick);
  }
  const PLAY_TEXT = "okay so the retry path is still admitting duplicates when the queue worker sees the same job id land twice inside the lease window, write a failing test first and then fix it and do not touch the scheduler";
  function toggleRec() {
    rec = !rec;
    $$(".rec-btn").forEach((b) => { b.classList.toggle("live", true); b.querySelector(".a").style.visibility = rec ? "hidden" : "visible"; b.querySelector(".b").style.visibility = rec ? "visible" : "hidden"; });
    $$(".ov-sq").forEach((s) => s.classList.toggle("hollow", !rec));
    $(".mb-mark").innerHTML = mbGlyph(rec ? "listening" : "idle");
    $("#mb-state").innerHTML = rec ? '<i class="sq"></i>Listening' : "Ready";
    $("#mb-toggle").textContent = rec ? "Stop Dictation" : "Start Dictation";
    $$(".ov-live-state").forEach((el) => (el.textContent = rec ? "LIVE" : "READY"));
    if (rec) { recT0 = performance.now(); raf = requestAnimationFrame(tick); }
    else { cancelAnimationFrame(raf); const pa = $("#play-area"); if (pa) pa.value = PLAY_TEXT.charAt(0).toUpperCase() + PLAY_TEXT.slice(1) + "."; drawTraces(); }
  }
  document.addEventListener("click", (e) => { if (e.target.closest(".rec-btn")) toggleRec(); });

  // ---------- wizard ----------
  let wstep = 0;
  function wizGo(i) {
    const pages = $$(".wiz-page");
    wstep = Math.max(0, Math.min(pages.length - 1, i));
    pages.forEach((p, k) => p.classList.toggle("on", k === wstep));
    $$(".wiz-rail .ws").forEach((w, k) => { w.classList.toggle("on", k === wstep); w.classList.toggle("done", k < wstep); w.querySelector(".s").textContent = k < wstep ? "Done" : k === wstep ? "Now" : ""; });
    $("#wiz-pg").textContent = String(wstep + 1).padStart(2, "0");
    $("#wiz-back").style.visibility = wstep === 0 ? "hidden" : "visible";
    const last = wstep === pages.length - 1;
    $("#wiz-next .a").textContent = last ? "Finish Setup" : wstep === 0 ? "Next" : "Continue";
    $("#wiz-crumb").textContent = pages[wstep].dataset.title;
  }
  function wizOpen(on) { $(".scrim").classList.toggle("on", on); $(".win").classList.toggle("focused", !on); if (on) wizGo(wstep); }
  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-wiz-open]")) { wstep = 0; wizOpen(true); }
    if (e.target.closest("#wiz-next")) { if (wstep === $$(".wiz-page").length - 1) { wizOpen(false); go("start"); } else wizGo(wstep + 1); }
    if (e.target.closest("#wiz-back")) wizGo(wstep - 1);
    if (e.target.closest("[data-wiz-close]")) wizOpen(false);
    const ws = e.target.closest(".wiz-rail .ws"); if (ws) wizGo(+ws.dataset.i);
  });

  // ---------- keyboard ----------
  document.addEventListener("keydown", (e) => {
    if (captureKey(e)) return;
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    if (e.key === "t" || e.key === "T") toggleTheme();
    if (e.key === "o" || e.key === "O") wizOpen(!$(".scrim").classList.contains("on"));
    if (e.key === "Escape") { closeMenus(); if ($(".scrim").classList.contains("on")) wizOpen(false); }
    if (e.key === "ArrowRight" && $(".scrim").classList.contains("on")) wizGo(wstep + 1);
    if (e.key === "ArrowLeft" && $(".scrim").classList.contains("on")) wizGo(wstep - 1);
    const navs = $$(".nav");
    if (/^[1-9]$/.test(e.key) && !e.metaKey) { const n = navs[+e.key - 1]; if (n) go(n.dataset.go); }
    if (e.key === "0") { const n = navs[9]; if (n) go(n.dataset.go); }
  });
  $("#proto-theme").addEventListener("click", toggleTheme);
  $("#titlebar-theme").addEventListener("click", toggleTheme);

  // ---------- clock ----------
  function clock() { const d = new Date(); $(".menubar .clock").textContent = d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }).toUpperCase().replace(",", "") + "  " + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }); }
  clock(); setInterval(clock, 30000);

  // ---------- screenshot hooks (used by shoot.py) ----------
  window.PROTO = {
    shots: () => [...$$(".nav").map((n) => n.dataset.go), "wizard-1", "wizard-2", "wizard-3", "wizard-4", "wizard-5", "menubar", "history-empty", "dict-empty", "hotkey-capture"],
    shot(name, theme) {
      themeOverride = theme; applyTheme(); closeMenus(); wizOpen(false);
      $$(".hk.capturing").forEach((h) => h.classList.remove("capturing")); capturing = null;
      $$("[data-empty]").forEach((x) => (x.hidden = x.dataset.empty === "on"));
      if (name.startsWith("wizard-")) { go("start"); wstep = +name.split("-")[1] - 1; wizOpen(true); return; }
      if (name === "menubar") { go("start"); $(".mb-mark").click(); const mi = $('#mbmenu .mi[data-sub="mic"]'); mi.dispatchEvent(new MouseEvent("mouseover", { bubbles: true })); mi.classList.add("is-hover"); return; }
      if (name === "history-empty" || name === "dict-empty") { const id = name === "history-empty" ? "history" : "dict"; go(id); $$(`#s-${id} [data-empty]`).forEach((x) => (x.hidden = x.dataset.empty !== "on")); return; }
      if (name === "hotkey-capture") { go("prefs"); const h = $("#s-prefs .hk"); h.classList.add("capturing"); const pane = $(".pane"); pane.scrollTop = h.getBoundingClientRect().top - pane.getBoundingClientRect().top - 260; return; }
      go(name);
    },
  };

  // ---------- boot ----------
  bracketize();
  window.MK_BRACKETIZE = bracketize;
  $(".mb-mark").innerHTML = mbGlyph("idle");
  applyTheme();
  let start = params.get("screen");
  try { start = start || localStorage.getItem("mk-screen"); } catch (e) {}
  go($(`.nav[data-go="${start}"]`) ? start : "start");
  if (params.get("wizard") === "1") wizOpen(true);
})();

</script>
</body>
</html>
